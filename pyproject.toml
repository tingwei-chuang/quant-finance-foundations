[project]
name = "quant-math-roadmap"
version = "0.1.0"
description = "An 8-week self-study roadmap building mathematical and methodological foundations for quantitative finance and systematic research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Quant Math Roadmap Contributors" }]
keywords = [
    "quantitative-finance",
    "education",
    "backtesting",
    "time-series",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
optimization = [
    "cvxpy>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nbmake>=1.5",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[project.urls]
# The repo name is `quant-finance-foundations` (the original GitHub repo); the
# package itself is named `quant-math-roadmap`. See README.md §11 for the
# naming history.
Homepage = "https://github.com/tingwei-chuang/quant-finance-foundations"
Repository = "https://github.com/tingwei-chuang/quant-finance-foundations"
Issues = "https://github.com/tingwei-chuang/quant-finance-foundations/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_math_roadmap"]

[tool.uv]
# Development dependencies are installed via the `dev` extra.
package = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Scope deprecation ignores to known noisy third-party code so we still see
# warnings raised by our own modules and by future pandas/numpy upgrades.
filterwarnings = [
    "ignore:.*statsmodels.*:DeprecationWarning",
    "ignore:.*statsmodels.*:FutureWarning",
    "ignore:.*nbformat.*:DeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
    "ignore:.*jupyter_client.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/quant_math_roadmap"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# P1-9: fail CI if coverage silently collapses below this floor.
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Notebooks are generated from scripts/build_notebooks.py and validated by
# executing them (pytest --nbmake). Their cells are pedagogical lesson code, so
# they are excluded from lint/format; the generator itself is linted.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E741",  # ambiguous variable names (l, I) are common in math code
    "N803",  # argument names such as X are standard in linear algebra
    "N806",  # variable names such as X, P are standard in math code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
# The notebook builders embed long Traditional-Chinese prose as string
# literals; a hard 100-column limit is not meaningful for that content.
"scripts/build_notebooks.py" = ["E501"]
"scripts/_notebook_lib/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["quant_math_roadmap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
