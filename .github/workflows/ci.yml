name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Notebooks and tests run entirely on synthetic data; no network access is
# required or expected during CI.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install the project (with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check with mypy
        run: mypy

      - name: Generate synthetic sample data
        run: python scripts/generate_synthetic_dataset.py

      - name: Run tests
        run: pytest --cov

      - name: Validate notebooks (offline, no network)
        run: pytest --nbmake notebooks/ notebooks/solutions/ --nbmake-timeout=600
