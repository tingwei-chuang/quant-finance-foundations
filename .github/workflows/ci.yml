name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Notebooks and tests run entirely on synthetic data; no network access is
# required or expected during CI.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install the project (with dev extras)
        # `uv sync` creates a managed .venv from uv.lock; it does not touch the
        # externally-managed system Python.
        run: uv sync --extra dev

      - name: Register the Jupyter kernel for notebook validation
        run: uv run python -m ipykernel install --user --name python3

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Generate synthetic sample data
        run: uv run python scripts/generate_synthetic_dataset.py

      - name: Run tests
        run: uv run pytest --cov

      - name: Validate notebooks (offline, no network)
        run: uv run pytest --nbmake notebooks/ notebooks/solutions/ --nbmake-timeout=600
