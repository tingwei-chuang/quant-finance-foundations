name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC run catches dependency drift even when no PRs
    # are open.
    - cron: "0 6 * * 1"

# Cancel in-flight runs for the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: read-only by default.
permissions:
  contents: read

# Notebooks and tests run entirely on synthetic data; no network access is
# required during CI.
jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project (with dev extras)
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy

      - name: Generate synthetic sample data
        run: uv run python scripts/generate_synthetic_dataset.py

      - name: Run tests (with coverage gate)
        run: uv run pytest --cov

  notebooks:
    # Notebook execution is heavier; one canonical Linux job is enough.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Register the Jupyter kernel for nbmake
        run: uv run python -m ipykernel install --user --name python3
      - name: Generate synthetic sample data
        run: uv run python scripts/generate_synthetic_dataset.py
      - name: Verify the notebook generator produces the committed notebooks
        run: uv run python scripts/build_notebooks.py --check
      - name: Validate notebooks (offline, no network)
        # `notebooks/` recursion picks up solutions/ too, so we list it once.
        run: uv run pytest --nbmake notebooks/ --nbmake-timeout=600

  audit:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: pip-audit (dependency vulnerability scan)
        # Strict on pushes to main and on the weekly schedule so maintainers
        # get a hard signal when a dependency CVE lands; soft on pull requests
        # so contributors are not blocked by transitive findings unrelated to
        # their change.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: uv run --with pip-audit pip-audit --strict
